name: Interactive prototype acceptance
on:
  workflow_dispatch:
    inputs:
      include_windows:
        description: 'Include the deferred Windows acceptance environment'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_windows && '["macos-15","windows-2022","ubuntu-latest"]' || '["macos-15","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Select an installed browser; do not silently skip browser acceptance
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const browser=[process.env.CHROME_PATH,'/Applications/Google Chrome.app/Contents/MacOS/Google Chrome','/usr/bin/google-chrome','/usr/bin/chromium',`${process.env.ProgramFiles}/Google/Chrome/Application/chrome.exe`,`${process.env['ProgramFiles(x86)']}/Microsoft/Edge/Application/msedge.exe`].find(p=>p&&fs.existsSync(p));
          if(!browser)throw new Error('Real browser required for artifact acceptance');
          fs.appendFileSync(process.env.GITHUB_ENV,`SYNAX_ARTIFACT_BROWSER=${browser}\nSYNAX_CHROME_PATH=${browser}\nSYNAX_ARTIFACT_BROWSER_QA=1\n`);
          JS
      - name: API typecheck and artifact/security suites
        run: npx tsc --noEmit
      - run: npx vitest run api/services/agent-runtime/artifacts api/services/agent-runtime/__tests__/prototype-manifest.test.ts api/services/agent-runtime/__tests__/prototype-integration.test.ts api/services/agent-runtime/__tests__/prototype-persistence.test.ts --maxWorkers=2
      - name: Browser SDK, cards, state and feedback
        run: npm run test --prefix web -- src/react/features/artifacts
      - name: Web typecheck
        run: npx tsc -p web/tsconfig.json --noEmit
      - name: Build the native package on the matching host
        run: npm run build:desktop
      - name: Real Web conversation acceptance
        run: npm run test:prototypes:web
      - name: Native desktop acceptance
        if: runner.os != 'Linux'
        env:
          SYNAX_ARTIFACT_NATIVE_SMOKE: '1'
        run: npx vitest run electron/lib/artifact-preview --maxWorkers=1
      - name: Packaged application acceptance
        if: runner.os != 'Linux'
        shell: bash
        run: |
          npm run test:desktop:smoke
          npm run test:prototypes:desktop
      - name: Install virtual desktop for Linux native acceptance
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox
      - name: Linux native desktop acceptance
        if: runner.os == 'Linux'
        env:
          SYNAX_ARTIFACT_NATIVE_SMOKE: '1'
        run: xvfb-run -a bash -c 'openbox >/tmp/openbox-artifacts.log 2>&1 & npx vitest run electron/lib/artifact-preview --maxWorkers=1 && npm run test:desktop:smoke && npm run test:prototypes:desktop'
      - name: Retain safe packaged acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-acceptance-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            out/artifact-acceptance/packaged-acceptance.json
            out/artifact-acceptance/packaged-prototype.png
            out/prototype-web-acceptance/acceptance.json
            out/prototype-web-acceptance/conversation.png
            out/desktop-smoke.png
            out/desktop-dark-work.png
