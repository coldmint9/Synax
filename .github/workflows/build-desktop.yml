name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          # @electron/node-gyp 10 only recognizes VS 2019/2022, not VS 2026.
          - os: windows-2022
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Test desktop platform behavior
        run: npm run test:desktop

      - name: Test UI update behavior
        run: npm run test:ui-updates

      - name: Test desktop update behavior
        run: npm run test:desktop-updates

      - name: Smoke test full macOS update
        if: runner.os == 'macOS'
        run: npm run test:desktop:update-smoke

      - name: Build API
        run: npm run build

      - name: Build Web
        run: npm run web:build

      - name: Build Electron
        run: npm run build:electron

      - name: Package desktop app
        run: npx electron-forge make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build desktop update manifest
        if: runner.os != 'Linux'
        run: npx tsx scripts/build-desktop-release.ts

      - name: Smoke test independent embedded updater
        if: runner.os != 'Linux'
        run: npm run test:desktop:updater-smoke

      - name: Smoke test packaged app (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:desktop:smoke

      - name: Smoke test packaged UI update and rollback (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:desktop:ui-update-smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/desktop-smoke.*
            out/ui-update-smoke.*
            out/embedded-updater-smoke.*
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synax-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*
            out/desktop-release/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: synax-*
          path: release-assets
          merge-multiple: true
      - name: Require a new or draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true || { echo 'Refusing to replace a published desktop release'; exit 1; }
          fi
      - name: Upload all platforms before publishing
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
      - name: Publish complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
