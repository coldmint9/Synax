name: Build Desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-updater:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build:electron
      - run: npm run build:updater
      - run: npm run test:desktop:updater-smoke
        timeout-minutes: 4
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-updater-diagnostics
          path: out/embedded-updater-smoke.*
          if-no-files-found: ignore
