name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
          # @electron/node-gyp 10 only recognizes VS 2019/2022, not VS 2026.
          - os: windows-2022
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Test desktop platform behavior
        run: npm run test:desktop

      - name: Test desktop publishing behavior
        if: runner.os == 'Linux'
        run: npx vitest run scripts/publish-desktop-*.test.ts

      - name: Test UI update behavior
        run: npm run test:ui-updates

      - name: Test desktop update behavior
        run: npm run test:desktop-updates

      - name: Smoke test full macOS update
        if: runner.os == 'macOS'
        run: npm run test:desktop:update-smoke

      - name: Build API
        run: npm run build

      - name: Build Web
        run: npm run web:build

      - name: Build Electron
        run: npm run build:electron

      - name: Package desktop app
        run: npx electron-forge make --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify Windows executable and installer branding
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-branding.ps1

      - name: Build desktop update manifest
        if: runner.os != 'Linux'
        run: npx tsx scripts/build-desktop-release.ts

      - name: Smoke test independent embedded updater
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npm run test:desktop:updater-smoke

      - name: Smoke test packaged app (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:desktop:smoke

      - name: Smoke test packaged UI update and rollback (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:desktop:ui-update-smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/desktop-smoke.*
            out/ui-update-smoke.*
            out/embedded-updater-smoke.*
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synax-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*
            out/desktop-release/*
          if-no-files-found: error

  publish-preview:
    needs: build
    # A failed or timed-out platform must not block the successful platforms.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Finish an upload before the next publisher can touch the rolling release.
    concurrency:
      group: desktop-preview-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: synax-*
          path: release-assets
          merge-multiple: true
      - name: Publish latest main preview
        uses: actions/github-script@v7
        with:
          script: |
            const publishPreview = require('./scripts/publish-desktop-preview.cjs');
            await publishPreview({ github, context, core });

  publish:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: synax-*
          path: release-assets
          merge-multiple: true
      - name: Publish successful platforms and complete existing releases
        uses: actions/github-script@v7
        with:
          script: |
            const publishRelease = require('./scripts/publish-desktop-release.cjs');
            await publishRelease({ github, context, core });
