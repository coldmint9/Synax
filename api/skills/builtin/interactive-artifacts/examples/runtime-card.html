<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:light dark}body{margin:0;padding:18px;background:light-dark(#f5f6f8,#15171b);font:13px/1.5 system-ui;color:light-dark(#363b43,#e7e8eb)}.card{max-width:380px;margin:auto;padding:12px;border-radius:16px;background:light-dark(white,#24272d)}button{display:flex;justify-content:space-between;width:100%;border:0;padding:0;background:none;color:inherit;font:inherit;text-align:left}.status{color:#649383;font-size:11px}.metrics{display:flex;justify-content:space-between;margin-top:8px;color:#838993;font-size:11px}.track{height:3px;background:#7a869122;margin-top:12px}.fill{width:10.7%;height:100%;background:#94a6c0}#detail{border-top:1px solid #8899aa22;margin-top:14px;padding-top:14px}#detail p{display:flex;justify-content:space-between}#detail[hidden]{display:none}
</style></head><body><section class="card" data-qa-id="runtime-card"><button id="toggle" aria-expanded="false"><strong>Runtime · Demo</strong><span class="status" id="status">运行中</span></button><div class="metrics"><span>上下文 21.4K / 200K</span><span>12 次调用</span></div><div class="track"><div class="fill"></div></div><div id="detail" hidden><p>指令 <span>3.2K</span></p><p>对话 <span>10.8K</span></p><p>工具 <span>7.4K</span></p><p>缓存复用 <span>78.5%</span></p></div></section><script>
let expanded=false;const button=document.getElementById('toggle');button.addEventListener('click',()=>{expanded=!expanded;document.getElementById('detail').hidden=!expanded;button.setAttribute('aria-expanded',String(expanded));});
</script></body></html>
