<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline previews use srcdoc only. Block child navigation before any network request. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'; object-src 'none'" />
    <meta
      name="description"
      content="Synax — Local-first AI coding workspace"
    />
    <link rel="icon" type="image/svg+xml" href="/synax-icon.svg" />
    <link rel="apple-touch-icon" href="/synax-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synax</title>
    <script>
      // Resolve appearance before the stylesheet paints; preserve explicit choices.
      try {
        const read = (key) => {
          try { return JSON.parse(localStorage.getItem(key) || "{}"); }
          catch { return {}; }
        };
        const saved = read("synax-theme-preferences");
        const legacy = read("rumbling-shell-preferences");
        const validMode = (value) => ["light", "dark", "system"].includes(value);
        const mode = validMode(saved?.mode) ? saved.mode
          : validMode(legacy?.theme) ? legacy.theme : "dark";
        const dark = mode === "dark" ||
          (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = "dark";
      }
      if (navigator.userAgent.includes("Electron"))
        document.documentElement.classList.add("electron");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
