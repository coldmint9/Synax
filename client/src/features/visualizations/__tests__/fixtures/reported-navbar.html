<script>
  (() => {
    const root = document.getElementById("synax-navbar-demo");
    if (!root) return;

    const stage = root.querySelector(".sx-stage");
    const widthLive = root.querySelector("[data-width-live]");
    const announce = root.querySelector("[data-live]");
    const toolbar = root.querySelector("#sx-toolbar");
    const themeBtn = root.querySelector("[data-theme-btn]");
    const projBtn = root.querySelector("#sx-proj-btn");
    const projMenu = root.querySelector("#sx-proj-menu");
    const projLabel = root.querySelector(".sx-proj-label");
    const crumb = root.querySelector(".sx-crumb");
    const actions = root.querySelector(".sx-actions");
    const tabs = Array.from(root.querySelectorAll(".sx-tab[role='tab']"));
    const panels = {
      work: root.querySelector("#sx-panel-work"),
      wiki: root.querySelector("#sx-panel-wiki"),
    };
    const sectionLabel = { work: "Work", wiki: "Wiki" };
    let activeTab = "work";

    const closeMenu = () => {
      projMenu.hidden = true;
      projBtn.setAttribute("aria-expanded", "false");
    };

    const syncChrome = () => {
      const width = Math.round(stage.getBoundingClientRect().width);
      widthLive.textContent = width + "px";
      toolbar.hidden = !(activeTab === "wiki" && width >= 640);
    };

    root.querySelectorAll(".sx-seg-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        stage.style.setProperty("--stage-w", btn.dataset.width + "px");
        root.querySelectorAll(".sx-seg-btn").forEach((other) => {
          const on = other === btn;
          other.classList.toggle("is-on", on);
          other.setAttribute("aria-pressed", String(on));
        });
      });
    });

    const selectTab = (id, focus) => {
      activeTab = id;
      tabs.forEach((tab) => {
        const on = tab.dataset.tab === id;
        tab.classList.toggle("is-on", on);
        tab.setAttribute("aria-selected", String(on));
        tab.tabIndex = on ? 0 : -1;
        if (on && focus) tab.focus();
      });
      Object.entries(panels).forEach(([key, panel]) => {
        panel.hidden = key !== id;
      });
      crumb.textContent = (projLabel.textContent || "synax-web") + " / " + sectionLabel[id] + (id === "wiki" ? " / 文档" : " / 会话");
      syncChrome();
      announce.textContent = "已切换到 " + sectionLabel[id];
    };

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => selectTab(tab.dataset.tab, false));
      tab.addEventListener("keydown", (event) => {
        const index = tabs.indexOf(tab);
        let next = -1;
        if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
        else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === "Home") next = 0;
        else if (event.key === "End") next = tabs.length - 1;
        if (next < 0) return;
        event.preventDefault();
        selectTab(tabs[next].dataset.tab, true);
      });
    });

    projBtn.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = projMenu.hidden;
      projMenu.hidden = !open;
      projBtn.setAttribute("aria-expanded", String(open));
      if (open) projMenu.querySelector(".sx-menu-item").focus();
    });

    projMenu.addEventListener("click", (event) => event.stopPropagation());
    root.addEventListener("click", closeMenu);
    projMenu.querySelectorAll(".sx-menu-item").forEach((item) => {
      item.addEventListener("click", () => {
        if (item.dataset.action === "import") {
          closeMenu();
          announce.textContent = "导入工作区";
          return;
        }
        projMenu.querySelectorAll(".sx-menu-item").forEach((other) => {
          const current = other === item;
          other.classList.toggle("is-current", current);
          if (other.getAttribute("role") === "menuitemradio") {
            other.setAttribute("aria-checked", String(current));
          }
        });
        projLabel.textContent = item.dataset.name;
        closeMenu();
        projBtn.focus();
        crumb.textContent = item.dataset.name + " / " + sectionLabel[activeTab] + (activeTab === "wiki" ? " / 文档" : " / 会话");
        announce.textContent = "已切换到工作区 " + item.dataset.name;
      });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !projMenu.hidden) {
        closeMenu();
        projBtn.focus();
      }
    });

    const searchBtn = root.querySelector("[data-search-btn]");
    const searchWrap = root.querySelector("[data-search-wrap]");
    const searchInput = root.querySelector("[data-search-input]");
    const searchClose = root.querySelector("[data-search-close]");
    const empty = root.querySelectorAll("[data-empty]");

    const applyFilter = (query) => {
      const needle = query.trim().toLowerCase();
      let shown = 0;
      let total = 0;
      Object.values(panels).forEach((panel) => {
        let panelShown = 0;
        panel.querySelectorAll(".sx-row").forEach((row) => {
          total += 1;
          const hit = needle === "" || row.textContent.toLowerCase().includes(needle);
          row.hidden = !hit;
          if (hit) panelShown += 1;
        });
        const note = panel.querySelector("[data-empty]");
        if (note) note.hidden = panelShown > 0;
        if (!panel.hidden) shown = panelShown;
      });
      announce.textContent = needle === "" ? "已清除筛选，共 " + total + " 条" : "匹配 " + shown + " 条";
    };

    const setSearching = (open) => {
      actions.classList.toggle("is-searching", open);
      searchWrap.hidden = !open;
      if (open) {
        searchInput.focus();
      } else {
        searchInput.value = "";
        applyFilter("");
        searchBtn.focus();
      }
    };

    searchBtn.addEventListener("click", () => setSearching(true));
    searchClose.addEventListener("click", () => setSearching(false));
    searchInput.addEventListener("input", () => applyFilter(searchInput.value));
    searchWrap.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.stopPropagation();
        setSearching(false);
      }
    });

    if (typeof ResizeObserver === "function") {
      new ResizeObserver(syncChrome).observe(stage);
    }
    themeBtn.addEventListener("click", () => {
      const dark = document.documentElement.style.colorScheme !== "dark";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      themeBtn.setAttribute("aria-pressed", String(dark));
      // SVG elements have no `hidden` IDL property, so toggle the attribute.
      themeBtn
        .querySelector("[data-theme-icon='moon']")
        .toggleAttribute("hidden", dark);
      themeBtn
        .querySelector("[data-theme-icon='sun']")
        .toggleAttribute("hidden", !dark);
      const label = dark ? "切换到浅色模式" : "切换到深色模式";
      themeBtn.setAttribute("aria-label", label);
      themeBtn.dataset.tooltip = label;
      announce.textContent = dark ? "已切换到深色模式" : "已切换到浅色模式";
    });
    syncChrome();
    applyFilter("");
  })();
</script>
