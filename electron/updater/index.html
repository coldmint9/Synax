<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'"
    />
    <title>Synax Updater</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #ecedf1;
        background: #101216;
        font-size: 13px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px;
        line-height: 1.55;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }
      .icon {
        width: 44px;
        height: 44px;
        background: #d5f5c2;
        color: #243921;
        display: grid;
        place-items: center;
        border-radius: 13px;
        font-size: 26px;
        font-weight: 700;
      }
      h1 {
        font-size: 21px;
        letter-spacing: -0.4px;
        margin: 0;
      }
      p {
        margin: 3px 0;
        color: #949ba8;
      }
      .tag {
        margin-left: auto;
        font-size: 11px;
        color: #bfe5af;
        border: 1px solid #35452f;
        background: #202a1d;
        padding: 3px 10px;
        border-radius: 20px;
      }
      section {
        margin: 22px 0;
      }
      .versions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        background: #1a1d23;
        border: 1px solid #2a2e37;
        border-radius: 12px;
        overflow: hidden;
      }
      .versions > div {
        padding: 18px 20px;
      }
      .versions > div + div {
        border-left: 1px solid #2a2e37;
      }
      .label {
        display: block;
        color: #929aaa;
        font-size: 12px;
        margin-bottom: 6px;
      }
      .version {
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .minor {
        margin-top: 8px;
        color: #8a92a0;
        font-size: 11px;
      }
      .message {
        margin: 16px 0 8px;
        font-size: 14px;
      }
      .error {
        color: #f6aaaa;
        overflow-wrap: anywhere;
      }
      .progress-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      progress {
        width: 100%;
        height: 6px;
        accent-color: #c4ecad;
      }
      #percent {
        font-variant-numeric: tabular-nums;
        color: #bac5b2;
        font-size: 12px;
      }
      h2 {
        font-size: 12px;
        font-weight: 600;
        color: #aab2c0;
        margin: 0 0 10px;
      }
      .notes {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 145px;
        overflow: auto;
        color: #c0c5d0;
        background: #171a20;
        padding: 14px;
        border-radius: 8px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      button {
        font: inherit;
        border: 1px solid #373d47;
        background: #252a32;
        color: #e7eaf0;
        border-radius: 7px;
        padding: 8px 13px;
        cursor: pointer;
      }
      button:hover {
        background: #303742;
      }
      button.primary {
        background: #c7edb4;
        border-color: #c7edb4;
        color: #23311d;
        font-weight: 600;
      }
      button.primary:hover {
        background: #daf6cc;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button[hidden],
      progress[hidden] {
        display: none;
      }
      .link {
        background: none;
        border: 0;
        color: #a6b3c9;
        padding-left: 0;
      }
      #history {
        color: #838d9d;
        font-size: 12px;
        max-height: 115px;
        overflow: auto;
      }
      .history-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
        border-top: 1px solid #272b33;
      }
      .history-row span:first-child {
        color: #c3cad7;
      }
      footer {
        font-size: 11px;
        color: #76808f;
        margin-top: 24px;
      }
      button:focus-visible {
        outline: 2px solid #c7edb4;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="icon" aria-hidden="true">S</div>
      <div>
        <h1>软件更新</h1>
        <p>Synax Updater</p>
      </div>
      <span class="tag">稳定版</span>
    </header>
    <div class="versions">
      <div>
        <span class="label">当前版本</span
        ><span id="current" class="version">—</span>
        <div class="minor">界面版本 <span id="ui-version">—</span></div>
      </div>
      <div>
        <span class="label">可用版本</span
        ><span id="latest" class="version">—</span>
        <div id="size" class="minor">包含内核、后台服务和界面</div>
      </div>
    </div>
    <div id="message" class="message" role="status" aria-live="polite">
      正在加载升级器…
    </div>
    <div class="progress-row">
      <progress id="progress" max="1" hidden aria-label="下载进度"></progress
      ><span id="percent"></span>
    </div>
    <div class="actions">
      <button id="check">检查更新</button
      ><button id="download" class="primary" hidden>下载更新</button
      ><button id="install" class="primary" hidden>安装并重启</button>
    </div>
    <section>
      <h2>更新说明</h2>
      <div id="notes" class="notes">检查新版本后，可在这里查看更新说明。</div>
      <button id="release" class="link" hidden>在 GitHub 查看版本详情 ↗</button>
    </section>
    <section>
      <h2>升级记录</h2>
      <div id="history">暂无升级记录</div>
    </section>
    <button id="ui-check" class="link">检查界面更新</button>
    <footer>
      安装前会请求关闭 Synax。升级器将继续运行，完成后重新打开应用。
    </footer>
    <script src="renderer.js"></script>
  </body>
</html>
