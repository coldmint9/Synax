<div id="git-merge-rebase">
  <h3 style="margin:0 0 12px;">git merge vs git rebase</h3>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button id="gmr-tab-merge" class="btn btn-primary" aria-pressed="true">git merge</button>
    <button id="gmr-tab-rebase" class="btn" aria-pressed="false">git rebase</button>
  </div>
  <svg id="gmr-graph" viewBox="0 0 760 228" style="width:100%;height:auto;display:block;" role="img" aria-label="git 分支图：merge 保留分叉并产生合并提交；rebase 把提交重放到 main 顶端，形成线性历史"></svg>
  <p id="gmr-caption" style="margin:10px 0 12px;min-height:2.8em;"></p>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="gmr-prev" class="btn">← 上一步</button>
    <button id="gmr-next" class="btn btn-primary">下一步 →</button>
    <span id="gmr-stepno" class="text-small" style="color:var(--muted-foreground);"></span>
  </div>
</div>
<style>
  #git-merge-rebase .edge { fill: none; stroke-width: 2.5; transition: opacity .35s; }
  #git-merge-rebase .edge-main { stroke: var(--viz-series-1); }
  #git-merge-rebase .edge-feat { stroke: var(--viz-series-2); }
  #git-merge-rebase .edge.is-hidden { opacity: 0; }
  #git-merge-rebase .edge.is-ghost { opacity: .22; stroke-dasharray: 4 4; }
  #git-merge-rebase .edge.is-preview { opacity: .45; stroke-dasharray: 5 5; }
  #git-merge-rebase .node { transition: opacity .35s; }
  #git-merge-rebase .node.is-hidden { opacity: 0; }
  #git-merge-rebase .node text { fill: #fff; font-size: 11.5px; font-weight: 500; text-anchor: middle; }
  #git-merge-rebase .c-main circle { fill: var(--viz-series-1); }
  #git-merge-rebase .c-feat circle { fill: var(--viz-series-2); }
  #git-merge-rebase .c-merge circle { fill: var(--purple); }
  #git-merge-rebase .node.is-ghost circle { fill: var(--card); stroke-width: 2; stroke-dasharray: 4 3; }
  #git-merge-rebase .c-main.is-ghost circle { stroke: var(--viz-series-1); }
  #git-merge-rebase .c-feat.is-ghost circle { stroke: var(--viz-series-2); }
  #git-merge-rebase .node.is-ghost text { fill: var(--muted-foreground); opacity: .75; }
  #git-merge-rebase .node.is-preview circle { fill: none; stroke: var(--purple); stroke-width: 2; stroke-dasharray: 5 4; }
  #git-merge-rebase .node.is-preview text { fill: var(--muted-foreground); opacity: .6; }
  #git-merge-rebase .ring { fill: none; stroke: var(--foreground); stroke-width: 1.5; opacity: 0; }
  #git-merge-rebase .is-focus .ring { animation: gmr-pulse 1.8s ease-out infinite; }
  @keyframes gmr-pulse { 0% { r: 15; opacity: .55; } 75% { r: 24; opacity: 0; } 100% { r: 24; opacity: 0; } }
  #git-merge-rebase #gmr-base-label { font-size: 11px; fill: var(--muted-foreground); text-anchor: middle; transition: opacity .35s; }
  #git-merge-rebase .blabel { transition: transform .5s ease, opacity .35s; }
  #git-merge-rebase .blabel rect { height: 20px; rx: 10px; }
  #git-merge-rebase .blabel-main rect { fill: var(--viz-series-1); }
  #git-merge-rebase .blabel-feat rect { fill: var(--viz-series-2); }
  #git-merge-rebase .blabel text { fill: #fff; font-size: 11px; font-weight: 500; text-anchor: middle; }
  #git-merge-rebase #gmr-caption code { background: var(--muted); color: var(--muted-foreground); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  var NODES = [
    { id: 'c1',  x: 60,  y: 80,  label: 'C1',  cls: 'c-main' },
    { id: 'c2',  x: 150, y: 80,  label: 'C2',  cls: 'c-main', base: true },
    { id: 'c3',  x: 320, y: 80,  label: 'C3',  cls: 'c-main' },
    { id: 'c4',  x: 440, y: 80,  label: 'C4',  cls: 'c-main' },
    { id: 'c5',  x: 320, y: 180, label: 'C5',  cls: 'c-feat' },
    { id: 'c6',  x: 440, y: 180, label: 'C6',  cls: 'c-feat' },
    { id: 'm',   x: 580, y: 130, label: 'M',   cls: 'c-merge' },
    { id: 'c5p', x: 560, y: 80,  label: 'C5′', cls: 'c-feat' },
    { id: 'c6p', x: 660, y: 80,  label: 'C6′', cls: 'c-feat' }
  ];

  var EDGES = [
    { id: 'e12',    d: 'M 74 80 L 136 80',                          cls: 'edge-main' },
    { id: 'e23',    d: 'M 164 80 L 306 80',                         cls: 'edge-main' },
    { id: 'e34',    d: 'M 334 80 L 426 80',                         cls: 'edge-main' },
    { id: 'e25',    d: 'M 162 89 C 210 135, 250 178, 306 180',      cls: 'edge-feat' },
    { id: 'e56',    d: 'M 334 180 L 426 180',                       cls: 'edge-feat' },
    { id: 'e4m',    d: 'M 453 85 C 495 100, 525 115, 567 125',      cls: 'edge-main' },
    { id: 'e6m',    d: 'M 453 175 C 495 163, 525 150, 567 135',     cls: 'edge-feat' },
    { id: 'e45p',   d: 'M 454 80 L 546 80',                         cls: 'edge-feat' },
    { id: 'e5p6p',  d: 'M 574 80 L 646 80',                         cls: 'edge-feat' }
  ];

  var STAGES = {
    merge: [
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'solid', c6: 'solid' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'solid', e56: 'solid' },
        labels: { main: [478, 80], feature: [478, 180] },
        caption: '初始：从 <code>C2</code> 分出 feature 后，两条分支各自前进 —— main 有了 C3、C4，feature 有了 C5、C6'
      },
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'solid', c6: 'solid', m: 'preview' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'solid', e56: 'solid', e4m: 'preview', e6m: 'preview' },
        labels: { main: [478, 80], feature: [478, 180] },
        focus: true,
        caption: '在 main 上执行 <code>git merge feature</code>：Git 沿两条分支回溯，找到共同祖先 <code>C2</code>，把两边的改动合并成一个新快照'
      },
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'solid', c6: 'solid', m: 'solid' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'solid', e56: 'solid', e4m: 'solid', e6m: 'solid' },
        labels: { main: [614, 130], feature: [478, 180] },
        caption: '产生合并提交 <code>M</code>（有两个父提交 C4、C6），main 前移到 M —— 分叉的真实历史被完整保留，日志呈网状'
      }
    ],
    rebase: [
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'solid', c6: 'solid' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'solid', e56: 'solid' },
        labels: { main: [478, 80], feature: [478, 180] },
        caption: '初始：同样是从 <code>C2</code> 分叉出来'
      },
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'solid', c6: 'solid' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'solid', e56: 'solid' },
        labels: { main: [478, 80], feature: [478, 180] },
        focus: true,
        caption: '在 feature 上执行 <code>git rebase main</code>：找到共同祖先 <code>C2</code>，把 feature 独有的 C5、C6 摘下来，暂存为补丁'
      },
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'ghost', c6: 'ghost', c5p: 'solid', c6p: 'solid' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'ghost', e56: 'ghost', e45p: 'solid', e5p6p: 'solid' },
        labels: { main: [478, 80], feature: [694, 80] },
        caption: 'C5、C6 被“复制”成 <code>C5′</code>、<code>C6′</code> 重新接在 C4 之后，原来的提交被丢弃 —— 新提交的内容一样，但 hash 完全改变'
      },
      {
        nodes: { c1: 'solid', c2: 'solid', c3: 'solid', c4: 'solid', c5: 'ghost', c6: 'ghost', c5p: 'solid', c6p: 'solid' },
        edges: { e12: 'solid', e23: 'solid', e34: 'solid', e25: 'ghost', e56: 'ghost', e45p: 'solid', e5p6p: 'solid' },
        labels: { main: [694, 58], feature: [694, 102] },
        caption: '接着 <code>git merge feature</code> 只会 fast-forward：main 直接指向 C6′ —— 最终历史是一条干净的直线，没有合并提交'
      }
    ]
  };

  var svg = document.getElementById('gmr-graph');
  var edgeEls = {}, nodeEls = {};

  EDGES.forEach(function (e) {
    edgeEls[e.id] = el('path', { d: e.d, 'class': 'edge ' + e.cls + ' is-hidden' }, svg);
  });

  NODES.forEach(function (n) {
    var g = el('g', { transform: 'translate(' + n.x + ',' + n.y + ')', 'class': 'node ' + n.cls + ' is-hidden' }, svg);
    el('circle', { r: 14 }, g);
    var t = el('text', { dy: 4 }, g);
    t.textContent = n.label;
    if (n.base) el('circle', { r: 18, 'class': 'ring' }, g);
    nodeEls[n.id] = g;
  });

  var baseLabel = el('text', { id: 'gmr-base-label', x: 150, y: 116, opacity: 0 }, svg);
  baseLabel.textContent = '共同祖先';

  function makeLabel(id, cls, w) {
    var g = el('g', { 'class': 'blabel ' + cls }, svg);
    el('rect', { x: -w / 2, y: -10, width: w, height: 20, rx: 10 }, g);
    var t = el('text', { dy: 4 }, g);
    t.textContent = id.replace('blabel-feat', 'feature').replace('blabel-main', 'main');
    return g;
  }
  var lblMain = makeLabel('main', 'blabel-main', 46);
  var lblFeat = makeLabel('feature', 'blabel-feat', 58);

  var tab = 'merge', step = 0;
  var cap = document.getElementById('gmr-caption');
  var stepno = document.getElementById('gmr-stepno');
  var prevBtn = document.getElementById('gmr-prev');
  var nextBtn = document.getElementById('gmr-next');
  var tabMerge = document.getElementById('gmr-tab-merge');
  var tabRebase = document.getElementById('gmr-tab-rebase');

  function setState(g, base, state) {
    var c = 'node ' + base;
    if (state === 'hidden') c += ' is-hidden';
    else if (state === 'ghost') c += ' is-ghost';
    else if (state === 'preview') c += ' is-preview';
    g.setAttribute('class', c);
  }

  function setLabel(g, pos) {
    if (pos) {
      g.style.opacity = 1;
      g.style.transform = 'translate(' + pos[0] + 'px,' + pos[1] + 'px)';
    } else {
      g.style.opacity = 0;
    }
  }

  function apply() {
    var st = STAGES[tab][step];
    NODES.forEach(function (n) { setState(nodeEls[n.id], n.cls, st.nodes[n.id] || 'hidden'); });
    if (st.focus) nodeEls.c2.classList.add('is-focus');
    baseLabel.style.opacity = st.focus ? 1 : 0;
    EDGES.forEach(function (e) {
      var s = st.edges[e.id] || 'hidden';
      var c = 'edge ' + e.cls;
      if (s === 'hidden') c += ' is-hidden';
      else if (s === 'ghost') c += ' is-ghost';
      else if (s === 'preview') c += ' is-preview';
      edgeEls[e.id].setAttribute('class', c);
    });
    setLabel(lblMain, st.labels.main);
    setLabel(lblFeat, st.labels.feature);
    cap.innerHTML = st.caption;
    stepno.textContent = '第 ' + (step + 1) + ' / ' + STAGES[tab].length + ' 步';
    prevBtn.disabled = step === 0;
    nextBtn.disabled = step === STAGES[tab].length - 1;
  }

  function switchTab(t) {
    tab = t; step = 0;
    tabMerge.classList.toggle('btn-primary', t === 'merge');
    tabRebase.classList.toggle('btn-primary', t === 'rebase');
    tabMerge.setAttribute('aria-pressed', t === 'merge');
    tabRebase.setAttribute('aria-pressed', t === 'rebase');
    apply();
  }

  tabMerge.addEventListener('click', function () { switchTab('merge'); });
  tabRebase.addEventListener('click', function () { switchTab('rebase'); });
  prevBtn.addEventListener('click', function () { if (step > 0) { step--; apply(); } });
  nextBtn.addEventListener('click', function () { if (step < STAGES[tab].length - 1) { step++; apply(); } });

  apply();
})();
</script>
