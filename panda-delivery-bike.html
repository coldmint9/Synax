<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熊猫外卖 · 骑车送餐 · 纯 CSS 物理动画</title>
<style>
/* ==========================================================================
   熊猫外卖 · 疯狂蹬车 —— 100% CSS 关键帧驱动
   --------------------------------------------------------------------------
   运动学：髋固定在车座，脚踝绑在曲柄末端走严格圆周，膝由两杆反解得出，
           因此大腿/小腿长度恒定，肢体绝不伸缩；双手铆在手把上反解肘。
   传动学：曲柄、链轮、链条、飞轮、车轮、地面共用同一时间基准 --T，
           轮面线速度 == 地面滚动速度，画面零打滑。
   动力学：蹬踏反作用力每半圈一次 → 躯干 2 倍踏频俯仰，头部反向补偿稳住视线。
   ========================================================================== */
:root{
  --T: .5357s;              /* 曲柄转一圈 = 60/112 rpm */
  --ratio: 1.6;             /* 传动比 */
  --wheel-dur: .33482s;     /* = T / ratio */
  --lines: 0;               /* 速度线 0/1 */
  --shake: 0;               /* 镜头抖动 0/1 */
  --blur: .5;               /* 辐条动态模糊 */
  --brand: #FF4A1C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100%;
  background:
    radial-gradient(1100px 620px at 78% -12%, #3d2417 0%, transparent 62%),
    radial-gradient(900px 520px at 4% 106%, #26181f 0%, transparent 60%),
    #0f0c0b;
  color:#FFF3E6;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; gap:13px;
  padding:16px 14px 26px;
}
.top{width:min(1200px,100%);display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;padding:0 4px}
.top h1{margin:0;font-size:19px;letter-spacing:.4px}
.top .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand)}
.top p{margin:0;font-size:12.5px;color:#C9B6AB}
.top p b{color:#FFD9C6;font-weight:600}

.stage{
  position:relative; width:min(1200px,100%);
  border-radius:18px; overflow:hidden;
  box-shadow:0 26px 60px -20px #000, 0 0 0 1px #322420 inset, 0 0 0 1px #1b1412;
  background:#0b0e12;
}
#world{transform-origin:50% 42%; transform:translate(var(--sx,0px),var(--sy,0px))}
body.shakeOn #world{animation:shake .12s steps(2,end) infinite}
@keyframes shake{
  0%{--sx:0px;--sy:0px}
  25%{--sx:-1.7px;--sy:1.2px}
  50%{--sx:1.4px;--sy:-1.5px}
  75%{--sx:-1.2px;--sy:-.9px}
  100%{--sx:1.6px;--sy:1.3px}
}
svg#scene{display:block;width:100%;height:auto;touch-action:none;cursor:ew-resize}

/* ---------- 通用动画接线：所有关键帧类共用同一套控制 ---------- */
.an{
  transform-box:view-box; transform-origin:0 0;
  animation-duration:var(--dur);
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  will-change:transform;
}
body.paused .an{animation-play-state:paused}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.badge{
  position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px;
  background:rgba(255,248,242,.94);color:#1E1B1A;border-radius:999px;
  padding:6px 13px 6px 10px;font-size:13px;font-weight:700;letter-spacing:.2px;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.5);
}
.badge em{color:#FF3D0C;font-style:normal}
.stats{position:absolute;right:14px;top:12px;display:flex;gap:9px}
.stat{
  min-width:92px;background:rgba(18,13,11,.72);backdrop-filter:blur(6px);
  border-radius:12px;padding:7px 12px 6px;text-align:right;
  border:1px solid rgba(255,255,255,.10);
}
.stat b{display:block;font-size:21px;line-height:1.05;letter-spacing:.5px}
.stat span{font-size:10.5px;color:#C6B2A7;letter-spacing:.3px}
.stat.hot b{color:#FF7A3C}

/* ---------- 控制台 ---------- */
.panel{
  width:min(1200px,100%);
  background:linear-gradient(#1c1512,#150f0d);
  border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:13px 18px;flex-wrap:wrap;
  box-shadow:0 18px 40px -22px #000, 0 0 0 1px #2f2320 inset;
}
.ctl{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#D9C7BC}
input[type=range]{-webkit-appearance:none;appearance:none;width:128px;height:22px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,#FF4A1C,#FFB03C 60%,#4a3730)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5.5px;border-radius:50%;background:#FFF6EE;box-shadow:0 2px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:#4a3730}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#FFF6EE}
output{min-width:62px;text-align:right;color:#FFC89A;font-weight:700;font-variant-numeric:tabular-nums}
button{
  appearance:none;border:1px solid #4a3730;background:#241a17;color:#F3E3D9;
  font:inherit;font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer;transition:.15s;
}
button:hover{background:#31231e;border-color:#6b4c40}
button[aria-pressed=true]{background:linear-gradient(#FF5A24,#E23A0C);border-color:#FF7A44;color:#fff;box-shadow:0 4px 14px -4px #FF4A1C}
.sep{width:1px;height:24px;background:#3a2b26}
.hint{font-size:11.5px;color:#A08E84;margin-left:auto;text-align:right;line-height:1.75}
kbd{background:#2c211d;border:1px solid #4b3a33;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit}

    <div class="stats">
      <div class="stat"><b id="vSpeed">0</b><span>车速 km/h</span></div>
      <div class="stat"><b id="vCad">112</b><span>踏频 rpm</span></div>

<div class="panel">
  <div class="ctl"><label for="cad">踏频</label>
    <input id="cad" type="range" min="40" max="150" step="1" value="112"><output id="cadOut">112 rpm</output></div>
  <div class="ctl"><label for="gear">传动比</label>
    <input id="gear" type="range" min="1" max="3.4" step="0.05" value="1.6"><output id="gearOut">1.60</output></div>
  <div class="ctl"><label for="speed">倍速</label>
    <input id="speed" type="range" min="25" max="200" step="5" value="100"><output id="speedOut">1.00×</output></div>
  <div class="sep"></div>
  <button id="btnPause" aria-pressed="false">暂停</button>
  <button id="btnLines" aria-pressed="false">速度线</button>
  <button id="btnShake" aria-pressed="false">镜头抖动</button>
  <button id="btnReset">复位</button>
  <span class="hint">
    <kbd>空格</kbd> 暂停 · <kbd>←</kbd><kbd>→</kbd> 调踏频 · 在画面左右<b>拖动</b> = 手动倒蹬逐帧检查
  </span>
</div>
<script>
(function(){
  "use strict";
  const $ = (s)=>document.querySelector(s);
  const TAU = Math.PI*2;

  /* ---- 与 gen.py 烘焙时同源的物理常数 ---- */
  const GEO = {
    wheelR : 80,      // 轮胎外半径 px
    wheelR_m : 0.34,  // 0.34 m → 比例尺 235.29 px/m
    tile : 744,       // 地面平铺周期（与 roadmove 一致）
    baseT : 60/112,   // 112rpm 对应的曲柄周期
    baseRatio : 1.6
  };

  const st = { cad:112, ratio:1.6, speed:1, paused:false };
  const root = document.documentElement;

  /* ---------------- 由踏频 / 传动比反推所有时间基准 ----------------
     T 曲柄一圈；车轮周期 = T/ratio；地面周期 = tile / 轮面线速度。
     三者同源 → 画面里轮子转一圈，地面正好滚过 TAU*R 的弧长，永不打滑。 */
  function applyPhysics(){
    const T      = (60/st.cad) / st.speed;                 // 曲柄一圈
    const Tw     = T / st.ratio;                           // 车轮一圈
    const vLine  = TAU*GEO.wheelR / Tw;                    // 轮面线速度 px/s
    const roadD  = GEO.tile / vLine;                       // 地面滚过一个 tile
    const kmh    = (TAU * GEO.wheelR_m * st.ratio / (60/st.cad)) * 3.6;

    root.style.setProperty("--T", T.toFixed(5)+"s");
    root.style.setProperty("--ratio", st.ratio.toFixed(3));
    root.style.setProperty("--wheel-dur", Tw.toFixed(5)+"s");
    root.style.setProperty("--road-dur", roadD.toFixed(5)+"s");

    // 速度线 / 拖影强度随实速连续变化
    const hot = Math.min(1, Math.max(0, (kmh-6)/26));
    root.style.setProperty("--blurvtmp", "0");
    const blur = document.querySelector("#blurDiscs");
    if (blur) blur.style.opacity = (0.25 + hot*0.6).toFixed(3);

    $("#vSpeed").textContent = kmh.toFixed(1);
    $("#vCad").textContent   = st.cad;
    $("#vRatio").textContent = st.ratio.toFixed(2);
    $("#gearOut").textContent  = st.ratio.toFixed(2);
    $("#cadOut").textContent   = st.cad + " rpm";
    $("#speedOut").textContent = st.speed.toFixed(2).replace(/0$/,"") + "\u00d7";

    // 链条虚线动画周期与牙盘同步（牙盘一圈）
    const dash = document.querySelectorAll(".chain");
    dash.forEach(d=>{ d.style.setProperty("--dur", T.toFixed(5)+"s"); });
  }

  function setPaused(p){
    st.paused = p;
    document.body.classList.toggle("paused", p);
    const b = $("#btnPause");
    b.setAttribute("aria-pressed", String(p));
    b.textContent = p ? "继续" : "暂停";
  }

  /* ---------------- 控件 ---------------- */
  $("#cad").addEventListener("input", (e)=>{ st.cad = +e.target.value; applyPhysics(); });
  $("#gear").addEventListener("input",(e)=>{ st.ratio = +e.target.value; applyPhysics(); });
  $("#speed").addEventListener("input",(e)=>{ st.speed = +e.target.value/100; applyPhysics(); });
  $("#btnPause").addEventListener("click", ()=> setPaused(!st.paused));
  $("#btnLines").addEventListener("click", (e)=>{
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on));
    root.style.setProperty("--lines", on ? 1 : 0);
  });
  $("#btnShake").addEventListener("click", (e)=>{
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on));
    document.body.classList.toggle("shakeOn", on);
    root.style.setProperty("--shake", on ? 1 : 0);
  });
  $("#btnReset").addEventListener("click", ()=>{
    st.cad = 112; st.ratio = 1.6; st.speed = 1;
    $("#cad").value = 112; $("#gear").value = 1.6; $("#speed").value = 100;
    setPaused(false);
    $("#btnLines").setAttribute("aria-pressed","false"); root.style.setProperty("--lines",0);
    $("#btnShake").setAttribute("aria-pressed","false"); document.body.classList.remove("shakeOn");
    applyPhysics();
  });

  document.addEventListener("keydown", (e)=>{
    if (e.code === "Space"){ e.preventDefault(); setPaused(!st.paused); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
      e.preventDefault();
      const d = (e.key === "ArrowRight") ? 2 : -2;
      st.cad = Math.min(150, Math.max(40, st.cad + d));
      $("#cad").value = st.cad; applyPhysics();
    }
  });

  /* ---------------- 拖动 = 手动倒蹬（时间轴拖动，逐帧检查） ----------------
     用反算出的动画延迟把每条关键帧推到指定相位，纯 CSS 播放，拖动只是改相位。 */
  const stage = $("#stage");
  let drag = null;
  stage.addEventListener("pointerdown", (e)=>{
    if (!st.paused) setPaused(true);
    drag = { x:e.clientX, t0:performance.now() };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", (e)=>{
    if (!drag) return;
    const T = parseFloat(getComputedStyle(root).getPropertyValue("--T")) || GEO.baseT;
    const dt = ((e.clientX - drag.x) / 900) * T * (TAU);   // 900px = 一整圈
    drag.t = (drag.t || 0) + dt;
    // 把所有循环动画统一向后偏移（负数延迟 = 已经播放了这么久）
    const off = (-((drag.t % T + T) % T)).toFixed(5) + "s";
    document.querySelectorAll(".an").forEach(n=>{ n.style.animationDelay = off; });
    drag.x = e.clientX;
    hilit(drag.t);
  });
  const end = (e)=>{ drag = null; try{ stage.releasePointerCapture(e.pointerId); }catch(_){} };
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", end);

  function hilit(){ /* 预留：拖拽时可在 HUD 显示当前曲柄相位 */ }

  applyPhysics();
})();
</script>
