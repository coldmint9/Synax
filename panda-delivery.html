<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>熊猫外卖骑手</title>
    <style>
      :root {
        --ink: #172326;
        --cream: #fff9e8;
        --yellow: #ffc928;
        --yellow-deep: #f3a900;
        --green: #38b66f;
        --road: #334249;
        --cycle: 0.72s;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 18%,
            rgba(255, 255, 255, 0.9),
            transparent 35%
          ),
          linear-gradient(#9be6ff 0 66%, #d8f4c7 66% 100%);
        font-family:
          Inter, ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .poster {
        position: relative;
        width: min(1120px, 100vw);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(
          #83ddff 0 65%,
          #dff3c8 65% 76%,
          #35454c 76% 100%
        );
        box-shadow: 0 35px 100px rgba(15, 58, 65, 0.25);
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: linear-gradient(
          110deg,
          rgba(255, 255, 255, 0.17),
          transparent 24% 74%,
          rgba(4, 52, 62, 0.08)
        );
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .sun {
        filter: drop-shadow(0 0 24px rgba(255, 220, 84, 0.72));
      }

      .cloud-a {
        animation: cloud-drift 18s linear infinite;
      }
      .cloud-b {
        animation: cloud-drift 24s linear -8s infinite;
      }
      .cloud-c {
        animation: cloud-drift 21s linear -15s infinite;
      }

      .city-near {
        animation: city-slide 7s linear infinite;
      }
      .city-far {
        animation: city-slide 12s linear infinite;
      }
      .road-markings {
        animation: road-slide 0.75s linear infinite;
      }
      .speed-line {
        animation: speed-line 0.9s linear infinite;
      }
      .speed-line:nth-child(2) {
        animation-delay: -0.26s;
      }
      .speed-line:nth-child(3) {
        animation-delay: -0.51s;
      }

      .bike-rider {
        animation: suspension 0.18s ease-in-out infinite alternate;
        transform-origin: 480px 410px;
      }

      .wheel-spin,
      .crank-spin,
      .chainring-spin {
        animation: spin var(--cycle) linear infinite;
      }

      .rear-wheel {
        transform-origin: 280px 405px;
      }
      .front-wheel {
        transform-origin: 660px 405px;
      }
      .crank-spin,
      .chainring-spin {
        transform-origin: 480px 383px;
      }

      .chain-dash {
        stroke-dasharray: 8 7;
        animation: chain-run 0.27s linear infinite;
      }

      .tail-ribbon {
        animation: ribbon 0.24s ease-in-out infinite alternate;
        transform-origin: 282px 231px;
      }
      .ear-left {
        animation: ear-flap 0.34s ease-in-out infinite alternate;
        transform-origin: 421px 103px;
      }
      .ear-right {
        animation: ear-flap 0.34s ease-in-out -0.17s infinite alternate;
        transform-origin: 503px 97px;
      }

      .front-leg {
        d: path("M 470 246 L 566 286 L 528 383");
        animation: front-leg var(--cycle) linear infinite;
      }

      .front-knee {
        animation: front-knee var(--cycle) linear infinite;
      }

      .front-foot {
        d: path("M 528 383 L 549 386");
        animation: front-foot var(--cycle) linear infinite;
      }

      .back-leg {
        d: path("M 454 249 L 365 303 L 432 383");
        animation: back-leg var(--cycle) linear infinite;
      }

      .back-knee {
        animation: back-knee var(--cycle) linear infinite;
      }

      .back-foot {
        d: path("M 432 383 L 452 379");
        animation: back-foot var(--cycle) linear infinite;
      }

      .panda-eye {
        animation: blink 4.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .scarf-tail {
        animation: scarf-wave 0.32s ease-in-out infinite alternate;
        transform-origin: 413px 171px;
      }

      .badge {
        position: absolute;
        z-index: 30;
        top: clamp(14px, 3vw, 34px);
        left: clamp(16px, 4vw, 44px);
        color: #0c3b34;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.42);
        user-select: none;
      }

      .badge strong {
        display: block;
        font-size: clamp(22px, 4vw, 52px);
        line-height: 0.95;
        letter-spacing: -0.06em;
        font-weight: 1000;
      }

      .badge span {
        display: inline-block;
        margin-top: 10px;
        padding: 6px 12px;
        border: 2px solid currentColor;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
        font-size: clamp(10px, 1.35vw, 16px);
        font-weight: 900;
        letter-spacing: 0.16em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes suspension {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(1.5px) rotate(-0.12deg);
        }
      }

      @keyframes cloud-drift {
        from {
          transform: translateX(180px);
        }
        to {
          transform: translateX(-1250px);
        }
      }

      @keyframes city-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-560px);
        }
      }

      @keyframes road-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-196px);
        }
      }

      @keyframes speed-line {
        0% {
          transform: translateX(190px);
          opacity: 0;
        }
        18% {
          opacity: 0.62;
        }
        100% {
          transform: translateX(-410px);
          opacity: 0;
        }
      }

      @keyframes chain-run {
        to {
          stroke-dashoffset: -30;
        }
      }
      @keyframes ribbon {
        to {
          transform: rotate(8deg) scaleX(1.06);
        }
      }
      @keyframes ear-flap {
        to {
          transform: rotate(5deg);
        }
      }
      @keyframes scarf-wave {
        to {
          transform: rotate(7deg) skewX(-8deg);
        }
      }

      @keyframes blink {
        0%,
        45%,
        49%,
        100% {
          transform: scaleY(1);
        }
        47% {
          transform: scaleY(0.08);
        }
      }

      /*
      两条腿使用同一组八分之一周期关键帧，并保持 180° 相位差。
      每个关键帧都明确给出髋、膝、脚踏三个关节点；脚端始终与曲柄端点重合。
    */
      @keyframes front-leg {
        0%,
        100% {
          d: path("M 470 246 L 566 286 L 528 383");
        }
        12.5% {
          d: path("M 470 246 L 545 318 L 514 417");
        }
        25% {
          d: path("M 470 246 L 522 336 L 480 431");
        }
        37.5% {
          d: path("M 470 246 L 515 340 L 446 417");
        }
        50% {
          d: path("M 470 246 L 524 335 L 432 383");
        }
        62.5% {
          d: path("M 470 246 L 545 318 L 446 349");
        }
        75% {
          d: path("M 470 246 L 568 280 L 480 335");
        }
        87.5% {
          d: path("M 470 246 L 573 263 L 514 349");
        }
      }

      @keyframes back-leg {
        0%,
        100% {
          d: path("M 454 249 L 365 303 L 432 383");
        }
        12.5% {
          d: path("M 454 249 L 359 292 L 446 349");
        }
        25% {
          d: path("M 454 249 L 377 319 L 480 335");
        }
        37.5% {
          d: path("M 454 249 L 410 343 L 514 349");
        }
        50% {
          d: path("M 454 249 L 429 350 L 528 383");
        }
        62.5% {
          d: path("M 454 249 L 434 351 L 514 417");
        }
        75% {
          d: path("M 454 249 L 419 347 L 480 431");
        }
        87.5% {
          d: path("M 454 249 L 389 330 L 446 417");
        }
      }

      @keyframes front-knee {
        0%,
        100% {
          transform: translate(566px, 286px);
        }
        12.5% {
          transform: translate(545px, 318px);
        }
        25% {
          transform: translate(522px, 336px);
        }
        37.5% {
          transform: translate(515px, 340px);
        }
        50% {
          transform: translate(524px, 335px);
        }
        62.5% {
          transform: translate(545px, 318px);
        }
        75% {
          transform: translate(568px, 280px);
        }
        87.5% {
          transform: translate(573px, 263px);
        }
      }

      @keyframes back-knee {
        0%,
        100% {
          transform: translate(365px, 303px);
        }
        12.5% {
          transform: translate(359px, 292px);
        }
        25% {
          transform: translate(377px, 319px);
        }
        37.5% {
          transform: translate(410px, 343px);
        }
        50% {
          transform: translate(429px, 350px);
        }
        62.5% {
          transform: translate(434px, 351px);
        }
        75% {
          transform: translate(419px, 347px);
        }
        87.5% {
          transform: translate(389px, 330px);
        }
      }

      @keyframes front-foot {
        0%,
        100% {
          d: path("M 528 383 L 550 386");
        }
        12.5% {
          d: path("M 514 417 L 535 423");
        }
        25% {
          d: path("M 480 431 L 501 433");
        }
        37.5% {
          d: path("M 446 417 L 467 413");
        }
        50% {
          d: path("M 432 383 L 453 378");
        }
        62.5% {
          d: path("M 446 349 L 467 345");
        }
        75% {
          d: path("M 480 335 L 501 338");
        }
        87.5% {
          d: path("M 514 349 L 535 355");
        }
      }

      @keyframes back-foot {
        0%,
        100% {
          d: path("M 432 383 L 452 379");
        }
        12.5% {
          d: path("M 446 349 L 466 345");
        }
        25% {
          d: path("M 480 335 L 500 338");
        }
        37.5% {
          d: path("M 514 349 L 534 354");
        }
        50% {
          d: path("M 528 383 L 548 387");
        }
        62.5% {
          d: path("M 514 417 L 534 422");
        }
        75% {
          d: path("M 480 431 L 500 433");
        }
        87.5% {
          d: path("M 446 417 L 466 413");
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-play-state: paused !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="一只熊猫骑自行车飞快送外卖的 CSS 动画">
      <div class="badge" aria-hidden="true">
        <strong>熊猫速达</strong>
        <span>热乎的，马上到</span>
      </div>

      <svg viewBox="0 0 1000 562.5" role="img" aria-labelledby="title desc">
        <title id="title">骑自行车送外卖的熊猫</title>
        <desc id="desc">
          熊猫双手握住自行车把手，双腿与旋转曲柄同步快速蹬踏，沿城市道路向前骑行。
        </desc>

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#72d7ff" />
            <stop offset="1" stop-color="#c6f2ff" />
          </linearGradient>
          <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#ffd947" />
            <stop offset="1" stop-color="#f5a600" />
          </linearGradient>
          <linearGradient id="bikePaint" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#ffe348" />
            <stop offset="1" stop-color="#ffad14" />
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
            <feGaussianBlur stdDeviation="7" />
          </filter>
        </defs>

        <!-- 天空 -->
        <rect width="1000" height="380" fill="url(#sky)" />
        <circle class="sun" cx="846" cy="92" r="47" fill="#ffe569" />
        <circle cx="846" cy="92" r="34" fill="#fff38d" />

        <g fill="#fff" opacity=".86">
          <g class="cloud-a" transform="translate(1040 110)">
            <ellipse cx="0" cy="0" rx="66" ry="23" />
            <circle cx="-28" cy="-16" r="25" />
            <circle cx="20" cy="-24" r="34" />
          </g>
          <g class="cloud-b" transform="translate(710 176) scale(.72)">
            <ellipse cx="0" cy="0" rx="72" ry="25" />
            <circle cx="-31" cy="-18" r="28" />
            <circle cx="23" cy="-25" r="36" />
          </g>
          <g class="cloud-c" transform="translate(1340 62) scale(.55)">
            <ellipse cx="0" cy="0" rx="68" ry="23" />
            <circle cx="-27" cy="-16" r="24" />
            <circle cx="21" cy="-22" r="32" />
          </g>
        </g>

        <!-- 远景城市，两组重复图形无缝向左移动 -->
        <g class="city-far" fill="#77bfd0" opacity=".6">
          <path
            d="M0 265h55v-74h48v74h36v-108h63v108h41v-54h54v54h52v-93h61v93h49v-67h63v67h38v115H0z"
          />
          <path
            d="M560 265h55v-74h48v74h36v-108h63v108h41v-54h54v54h52v-93h61v93h49v-67h63v67h38v115H560z"
          />
        </g>
        <g class="city-near" fill="#5aa8a0" opacity=".9">
          <path
            d="M-20 318h72v-82h56v82h54v-47h80v47h34v-96h70v96h58v-62h74v62h82v72H-20z"
          />
          <path
            d="M540 318h72v-82h56v82h54v-47h80v47h34v-96h70v96h58v-62h74v62h82v72H540z"
          />
        </g>
        <path
          d="M0 343 Q140 305 260 340 T520 336 T780 340 T1040 332 V432 H0z"
          fill="#8bd172"
        />
        <path
          d="M0 373 Q130 346 255 374 T520 369 T780 372 T1030 365 V439 H0z"
          fill="#5dbf65"
        />

        <!-- 公路 -->
        <rect y="430" width="1000" height="133" fill="#35454d" />
        <rect y="430" width="1000" height="8" fill="#f8d24e" />
        <g class="road-markings" fill="#eff5ed">
          <rect x="-110" y="510" width="108" height="11" rx="5" />
          <rect x="86" y="510" width="108" height="11" rx="5" />
          <rect x="282" y="510" width="108" height="11" rx="5" />
          <rect x="478" y="510" width="108" height="11" rx="5" />
          <rect x="674" y="510" width="108" height="11" rx="5" />
          <rect x="870" y="510" width="108" height="11" rx="5" />
          <rect x="1066" y="510" width="108" height="11" rx="5" />
        </g>

        <!-- 速度线 -->
        <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".5">
          <path class="speed-line" d="M810 207h112" stroke-width="6" />
          <path class="speed-line" d="M860 257h72" stroke-width="4" />
          <path class="speed-line" d="M790 315h134" stroke-width="5" />
        </g>

        <!-- 地面接触阴影 -->
        <ellipse
          cx="474"
          cy="523"
          rx="292"
          ry="20"
          fill="#17262b"
          opacity=".28"
          filter="url(#softShadow)"
        />

        <g class="bike-rider">
          <!-- 后轮 -->
          <g class="wheel-spin rear-wheel">
            <circle
              cx="280"
              cy="405"
              r="119"
              fill="none"
              stroke="#172326"
              stroke-width="14"
            />
            <circle
              cx="280"
              cy="405"
              r="106"
              fill="none"
              stroke="#e9f6ed"
              stroke-width="4"
            />
            <g stroke="#84999d" stroke-width="2.5" opacity=".78">
              <path
                d="M280 299v212M174 405h212M205 330l150 150M205 480l150-150"
              />
              <path
                d="M225 313l110 184M188 350l184 110M188 460l184-110M225 497l110-184"
              />
            </g>
            <circle
              cx="280"
              cy="405"
              r="13"
              fill="#f7b719"
              stroke="#172326"
              stroke-width="5"
            />
          </g>

          <!-- 前轮 -->
          <g class="wheel-spin front-wheel">
            <circle
              cx="660"
              cy="405"
              r="119"
              fill="none"
              stroke="#172326"
              stroke-width="14"
            />
            <circle
              cx="660"
              cy="405"
              r="106"
              fill="none"
              stroke="#e9f6ed"
              stroke-width="4"
            />
            <g stroke="#84999d" stroke-width="2.5" opacity=".78">
              <path
                d="M660 299v212M554 405h212M585 330l150 150M585 480l150-150"
              />
              <path
                d="M605 313l110 184M568 350l184 110M568 460l184-110M605 497l110-184"
              />
            </g>
            <circle
              cx="660"
              cy="405"
              r="13"
              fill="#f7b719"
              stroke="#172326"
              stroke-width="5"
            />
          </g>

          <!-- 外卖箱和后货架 -->
          <path
            d="M257 287h175"
            fill="none"
            stroke="#172326"
            stroke-width="9"
            stroke-linecap="round"
          />
          <path
            d="M278 285l-3 113M404 285l39 111"
            fill="none"
            stroke="#172326"
            stroke-width="6"
          />
          <g>
            <path
              d="M270 183h124l15 104H258z"
              fill="url(#box)"
              stroke="#172326"
              stroke-width="7"
              stroke-linejoin="round"
            />
            <path
              d="M273 182l16-28h89l16 28"
              fill="#ffe361"
              stroke="#172326"
              stroke-width="7"
              stroke-linejoin="round"
            />
            <path
              d="M270 215h126"
              stroke="#fff5ba"
              stroke-width="5"
              opacity=".8"
            />
            <circle
              cx="334"
              cy="240"
              r="27"
              fill="#fff8dc"
              stroke="#172326"
              stroke-width="5"
            />
            <path
              d="M320 242q14-23 29 0-7 16-15 19-9-4-14-19z"
              fill="#35ae69"
            />
            <path
              d="M328 226q-2-10 7-13M339 226q4-9 13-7"
              fill="none"
              stroke="#172326"
              stroke-width="4"
              stroke-linecap="round"
            />
            <path
              class="tail-ribbon"
              d="M273 225q-27 8-47-8 16 25 47 28z"
              fill="#f04444"
              stroke="#172326"
              stroke-width="5"
            />
          </g>

          <!-- 后腿：位于车架之后 -->
          <path
            class="back-leg"
            fill="none"
            stroke="#11191b"
            stroke-width="31"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle class="back-knee" r="17" fill="#202b2d" />
          <path
            class="back-foot"

            stroke="#101718"

          <!-- 链条和车架 -->
          <path
            d="M280 405L480 383L441 271Z"
            fill="none"

          <path
            d="M441 271L602 282L480 383Z"

          />
          <path

          />
          <path
            d="M480 367L280 389M480 399L280 421"

            stroke="#253337"

          />
          <circle
            cx="280"
            cy="405"
            r="24"
            fill="none"
            stroke="#253337"
            stroke-width="6"
          />
          <g class="chainring-spin">
            <circle
              cx="480"
              cy="383"
              r="31"
              fill="#ffcf26"
              stroke="#172326"
              stroke-width="6"
            />
            <path
              d="M480 354v58M451 383h58M460 363l40 40M460 403l40-40"
              stroke="#172326"
              stroke-width="4"
            />
          </g>

          <!-- 座椅、前叉和车把 -->
          <path
            d="M430 263h42"
            stroke="#172326"
            stroke-width="13"
            stroke-linecap="round"
          />
          <path
            d="M602 282l-4-50 30-16"
            fill="none"
            stroke="#172326"
            stroke-width="9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M610 215h30"
            stroke="#172326"
            stroke-width="10"
            stroke-linecap="round"
          />
          <path d="M603 283l57 122" stroke="#f2ad14" stroke-width="7" />

          <!-- 熊猫身体 -->
          <g>
            <path
              d="M422 170q32-32 71-2 31 25 34 85-21 32-79 18-35-33-26-101z"
              fill="#fff9e8"
              stroke="#172326"
              stroke-width="7"
            />
            <path d="M427 229q20 28 50 32l-8 28q-41-1-55-37z" fill="#172326" />
            <path
              d="M493 174q25 26 29 65-18 13-36 4 5-38 7-69z"
              fill="#172326"
            />
            <path d="M419 174q-14 34 3 65l28-14q-6-31-31-51z" fill="#172326" />
            <path
              d="M411 174q34 16 85 5"
              fill="none"
              stroke="#ef4444"
              stroke-width="12"
              stroke-linecap="round"
            />
            <path
              class="scarf-tail"
              d="M417 174q-40 4-68-18 15 27 60 35z"
              fill="#ef4444"
              stroke="#172326"
              stroke-width="5"
              stroke-linejoin="round"
            />
          </g>
