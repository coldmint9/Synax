[package]
name = "synax-runtime-sidecar"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures-util = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "io-util", "signal", "sync", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
