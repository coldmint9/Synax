[package]
name = "synax-runtime-sidecar"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures-util = "0.3"
prost = "0.14"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "io-util", "io-std", "signal", "sync", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rocksdb = { version = "0.25", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
