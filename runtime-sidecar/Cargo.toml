[package]
name = "synax-runtime-sidecar"
version = "2.1.1"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rig-core = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
http = "1"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
ignore = "0.4"
notify = "8"
prost = "0.14"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "net", "io-util", "io-std", "signal", "sync", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rocksdb = { version = "0.25", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
