[package]
name = "synax-runtime-sidecar"
version = "2.9.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rig-core = { version = "0.44", default-features = false, features = ["reqwest", "rustls"] }
http = "1"
bytes = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
futures-util = "0.3"
arc-swap = "1"
async-stream = "0.3"
ignore = "0.4"
notify = "8"
parking_lot = "0.12"
im = "15"
prost = "0.14"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "net", "io-util", "io-std", "signal", "sync", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }


[lib]
name = "synax_runtime_sidecar"
path = "src/lib.rs"
