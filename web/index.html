<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Synax — Local-first AI coding workspace"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synax</title>
    <script>
      // Resolve appearance before the stylesheet paints; preserve explicit choices.
      try {
        const saved = JSON.parse(
          localStorage.getItem("rumbling-shell-preferences") || "{}",
        );
        const dark =
          saved?.theme === "dark" ||
          (saved?.theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches,
        );
      }
      if (navigator.userAgent.includes("Electron"))
        document.documentElement.classList.add("electron");
    </script>
  </head>
  <body>
    <!-- Liquid-glass displacement filter referenced by .wh-pill via
         backdrop-filter: url(). Zero-sized but rendered — display:none would
         break filter references in some engines. -->
    <svg
      aria-hidden="true"
      style="position: fixed; width: 0; height: 0; overflow: hidden"
    >
      <defs>
        <filter
          id="liquid_glass_filter"
          x="0%"
          y="0%"
          width="100%"
          height="100%"
          filterUnits="objectBoundingBox"
        >
          <feDisplacementMap
            in="SourceGraphic"
            in2="SourceGraphic"
            scale="200"
          />
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
